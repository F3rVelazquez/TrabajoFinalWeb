<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="Estilo.css">
</head>

<body>
    <div class="cuerpoform">
        <header>
            <img style="border: inset 1px #2b2d27a9;" src="Imagenes/E.jpg" width="700" height="150" alt="Torneo">
            <div class="Encabezado">
                <a href="index.html"> <button>Principal</button></a> <br><br>
                <a href="Pagina2.html"> <button>Equipables</button></a>
            </div>
        </header>

        <h2>Formulario de contacto</h2>

        <p class="aviso">Completa los datos para recibir novedades y participar en el sorteo!</p>

        <div class="formu">
            <form class="formulario" novalidate onsubmit="validar(event)">
                <div class="bordeform">
                    <label for="Usuario">Usuario: </label><br>
                    <input type="text" name="Usuario" id="Usuario" required><br><br>

                    <label for="Email">Email: </label><br>
                    <input type="email" name="Email" id="Email" required><br><br>

                    <label for="Telefono">Telefono:</label><br>
                    <input type="tel" name="Telefono" id="Telefono" placeholder="NNN-NNN-NNNN"><br><br>
                </div>
                <div class="botonform">
                    <button type="submit">OK</button>
                    <button type="reset">Cancel</button>
                </div>
            </form>
        </div>
        <div class="errores">
            <p class="aviso" id="resultado"></p>
        </div>
    </div>

</body>
<script>
    function validar(event) {
        event.preventDefault();

        let usuario = document.getElementById('Usuario').value;
        let email = document.getElementById('Email').value;
        let tel = document.getElementById('Telefono').value;

        let correccion = "";

        if (usuario == "") {
            correccion += "Debe ingresar un usuario.<br>"
        } else if (usuario.length < 5 || usuario.length > 15) {
            correccion += "El usuario debe tener entre 5 y 15 caracteres.<br>"
        }

        let patronEmail = /^[a-zA-Z0-9._%+-]+@[a-zA-Z0-9.-]+\.[a-zA-Z]+$/;
        if (email == "") {
            correccion += "Debe ingresar un email.<br>"
        } else if (!patronEmail.test(email)) {
            correccion += "El email es invalido.<br>"
        }

        let telpatron = /^\d{3}-\d{3}-\d{4}$/
        if (tel == "") {
            correccion += "Debe ingresar un número de telefono.<br>"
        } else if (!telpatron.test(tel)) {
            correccion += "El número debe cumplir el formato. "
        }

        let resultado = document.getElementById("resultado");

        if (correccion !== "") {
            resultado.innerHTML = correccion;
            resultado.style.color = "red";
        } else {
            correccion = "";
            resultado.innerHTML += "Se han enviado los datos correctamente!<br>"
            resultado.innerHTML += "El sorteo se realiza en 5 días!"
            resultado.style.color = "#c8ae04fe";
        }
    }
</script>

</html>
