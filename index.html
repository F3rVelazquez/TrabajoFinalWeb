<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Web Page</title>
    <link rel="stylesheet" href="Estilo.css">
</head>

<body>
    <header>
        <img src="cs banner.jpg" width="1500" height="300" alt="banner">
        <h1>Inicio</h1>
        <a href="Pagina2.html"> Página 2</a> <br><br>
        <a href="Pagina3.html"> Página 3</a><br><br>
    </header>
    <main>
        <div class="carrousel" id="carrousel" style="display: flex;">
            <button id="atras">⬅️</button>
            <img id="foto" src="" alt="foto">
            <button id="adelante">➡️</button>
        </div>
    </main>
    <footer>
        <p>&copy; 2023 My Web Page</p>
    </footer>
</body>
<script>
    let imagenes = ["Imagenesdeprueba/cara1.jpeg", "Imagenesdeprueba/cara2.jpeg", "Imagenesdeprueba/cara3.jpeg", "Imagenesdeprueba/cara4.jpeg", "Imagenesdeprueba/cara5.png", "Imagenesdeprueba/cara6.png"];

    let indice = 0;

    ima = document.getElementById("foto");
    document.getElementById("adelante").onclick = Adelantar;
    document.getElementById("atras").onclick = Atras;



    ima.src = imagenes[indice];

    function Adelantar() {
        indice++;
        if (indice >= imagenes.length) {
            indice = 0;
        }

        ima.src = imagenes[indice];
    }

    function Atras() {
        indice--;
        if (indice < 0) {
            indice = imagenes.length - 1;
        }
        ima.src = imagenes[indice];
    }
</script>

</html>
