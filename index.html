<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Web Page</title>
    <link rel="stylesheet" href="Estilo.css">
</head>

<body>
    <div class="cuerpo">
        <header>
            <img style="border: solid 1px greenyellow;" src="cs banner.jpg" width="1200" height="250" alt="banner">
            <h1>Inicio</h1>
            <a href="Pagina2.html"> Página 2</a> <br><br>
            <a href="Pagina3.html"> Página 3</a><br><br>
        </header>

        <main>
            <div class="carrousel" id="carrousel">
                <button id="atras">⬅️</button>
                <img id="foto" src="" alt="foto">
                <button id="adelante">➡️</button>
            </div>
        </main>
        <footer>
            <p>&copy; 2023 My Web Page</p>
        </footer>
    </div>
</body>
<script>
    let imagenes = ["Imagenes/imagen1.jpg", "Imagenes/imagen2.jpg", "Imagenes/imagen3.jpg", "Imagenes/imagen4.jpg", "Imagenes/imagen5.jpg", "Imagenes/imagen6.jpg", "Imagenes/imagen7.jpg", "Imagenes/imagen8.jpg"];

    let indice = 0;

    ima = document.getElementById("foto");
    document.getElementById("adelante").onclick = Adelantar;
    document.getElementById("atras").onclick = Atras;



    ima.src = imagenes[indice];

    function Adelantar() {
        indice++;
        if (indice >= imagenes.length) {
            indice = 0;
        }

        ima.src = imagenes[indice];
    }

    function Atras() {
        indice--;
        if (indice < 0) {
            indice = imagenes.length - 1;
        }
        ima.src = imagenes[indice];
    }
</script>

</html>
